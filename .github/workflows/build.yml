# BYR Next: 올릴 때마다 (1) 리눅스에서 실제 Electron 으로 켜 보는 확인 (2) 윈도우 포터블 exe 만들기
name: build
on:
  push:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Electron 으로 켜서 샘플 불러오기 · 스타일 전환까지 확인
        run: xvfb-run -a npx electron . --smoke --no-sandbox --use-gl=swiftshader --enable-unsafe-swiftshader
  windows:
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BYR-Next-windows
          path: dist/*.exe
          if-no-files-found: error
  android:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: 안드로이드 프로젝트 만들기 (renderer 폴더를 앱 안에 넣음 · 인터넷 없이 실행) · 아이콘 · 버전
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#3d6bff' --splashBackgroundColor '#1b1d21' --splashBackgroundColorDark '#1b1d21'
          npx cap sync android
          node scripts/android-version.js
      - name: 테스트용 APK (바로 설치) · 스토어용 AAB
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug bundleRelease
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk BYR-Next.apk
      - name: AAB 서명 (저장소 Secrets 에 업로드 키가 있으면)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab BYR2-unsigned.aab
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > upload.jks
            cp BYR2-unsigned.aab BYR2-release.aab
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PW" BYR2-release.aab "${KS_ALIAS:-byr2upload}"
            rm upload.jks BYR2-unsigned.aab
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BYR-Next-android
          path: |
            BYR-Next.apk
            BYR2-*.aab
          if-no-files-found: error
