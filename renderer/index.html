<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' blob: data: https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://zxehyxjjiruxgqkthotn.supabase.co">
<title>BYR2</title>
<link rel="stylesheet" href="./styles.css">
<!-- Three.js 는 전부 로컬(vendor)에서 읽는다. CDN 없음 -->
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<!-- 인트로: 모듈을 읽는 동안 바로 보이도록 HTML 에 직접 -->
<div id="intro" aria-label="BYR2"><div class="logo" aria-hidden="true"></div><b class="word">BYR2</b><small class="sub">Build Your Restaurant</small><div class="credit">Created by Marcus Lee</div></div>
<div id="app">
  <!-- 화면: 2D 도면 | 3D (분할 · 한쪽만) -->
  <main id="stage" class="psplit">
    <canvas id="plan" aria-label="2D 도면"></canvas>
    <canvas id="view" aria-label="3D 매장 화면"></canvas>
    <!-- 2D 도구 (도면이 보일 때만) -->
    <div id="planTools" role="toolbar" aria-label="도면 도구" aria-orientation="vertical">
      <button class="ib" data-tool="select" aria-pressed="true" title="고르기 · 끌기 (벽 끝점 · 문 · 기물)" aria-label="고르기"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
      <button class="ib" data-tool="wall" aria-pressed="false" title="벽 그리기 (점을 차례로 톡 · 또는 끌기 · 같은 점 한 번 더 / Esc 로 끝)" aria-label="벽 그리기"><svg viewBox="0 0 24 24"><path d="M4 18L20 6" stroke-width="4"/><circle cx="4" cy="18" r="1.6"/><circle cx="20" cy="6" r="1.6"/></svg></button>
      <button class="ib" data-tool="door1" aria-pressed="false" title="문 넣기 (벽을 톡)" aria-label="문"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V6M6 6a14 14 0 0 1 14 14"/></svg></button>
      <button class="ib" data-tool="window" aria-pressed="false" title="창 넣기 (벽을 톡)" aria-label="창"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M3 12h18M3 9v6M21 9v6"/></svg></button>
      <button class="ib" data-tool="pass" aria-pressed="false" title="배식구 넣기 (벽을 톡)" aria-label="배식구"><svg viewBox="0 0 24 24"><path d="M3 12h3M9 12h3M15 12h3M3 8v8M21 8v8"/></svg></button>
      <button class="ib" data-tool="roomRect" aria-pressed="false" title="공간 그리기 · 사각형 (끌기)" aria-label="공간 사각형"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1" stroke-dasharray="3 2"/><path d="M9 12h6"/></svg></button>
      <button class="ib" data-tool="roomPoly" aria-pressed="false" title="공간 그리기 · 선 (꼭짓점을 차례로 · 첫 점을 다시 누르면 닫힘)" aria-label="공간 선"><svg viewBox="0 0 24 24"><path d="M4 18l3-12 9 2 4 9z" stroke-dasharray="3 2"/><circle cx="4" cy="18" r="1.5"/><circle cx="7" cy="6" r="1.5"/><circle cx="16" cy="8" r="1.5"/><circle cx="20" cy="17" r="1.5"/></svg></button>
      <button class="ib" id="btnRooms" title="공간 목록 (태그 · 공간만 작업)" aria-label="공간 목록"><svg viewBox="0 0 24 24"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h10"/></svg></button>
      <button class="ib" data-tool="measure" aria-pressed="false" title="줄자 (두 점 사이를 끌기 · 2D · 3D 치수)" aria-label="줄자"><svg viewBox="0 0 24 24"><path d="M3 15l12-12 6 6-12 12z"/><path d="M7 11l2 2M10 8l2 2M13 5l2 2"/></svg></button>
      <button class="ib" data-tool="erase" aria-pressed="false" title="지우기 (톡)" aria-label="지우기"><svg viewBox="0 0 24 24"><path d="M8 20h12M5 14l8-8 6 6-7 7H8z"/></svg></button>
      <button class="ib" id="btnFit" title="도면 전체 보기" aria-label="도면 전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </main>

  <!-- 상단 바: 홈 · 이름 · 되돌리기 · 화면 나누기 · 파일 (폰에서도 전부 보이는 것만) -->
  <header id="topbar" role="toolbar" aria-label="프로젝트">
    <button class="ib" id="btnHome" aria-label="홈 (프로젝트 목록 · 계정 · AI)" title="홈 · 내 프로젝트"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg></button>
    <div class="title"><b id="projName">BYR2</b><small id="saveState" class="savest" aria-live="polite"></small></div>
    <select id="levelSel" aria-label="층" title="층 고르기" hidden></select>
    <div class="grow"></div>
    <button class="ib" id="btnUndo" aria-label="되돌리기" title="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib wide" id="btnRedo" aria-label="다시 실행" title="다시 실행"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <div class="seg" role="group" aria-label="화면 나누기">
      <button class="ib txt" data-pane="2d" aria-pressed="false" title="2D 도면만">2D</button>
      <button class="ib txt" data-pane="split" aria-pressed="true" title="2D + 3D 함께 (2D 에서 그리면 3D 에 바로)">분할</button>
      <button class="ib txt" data-pane="3d" aria-pressed="false" title="3D 만">3D</button>
    </div>
    <button class="ib" id="btnFile" aria-label="메뉴 (열기 · 저장 · 가져오기 · 내보내기)" aria-haspopup="menu" aria-expanded="false" title="메뉴"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
  </header>

  <!-- 아래 도구 막대: app.js 의 DOCK 목록으로 그린다 (도구를 늘릴 때는 목록에 한 줄만 더하면 됨) -->
  <nav id="dock" aria-label="도구"><div id="dockIn" role="toolbar"></div></nav>
  <!-- 조정 필요 · 공간만 작업 -->
  <button id="fitFab" class="pill warn" hidden>조정 필요</button>
  <div id="focusBar" class="pill" hidden><span id="focusName"></span><button class="btn" id="focusExit">전체 보기</button></div>

  <div id="airHud" class="pill hud" hidden></div>

  <!-- 보기 스타일 메뉴 -->
  <div id="styleMenu" class="menu" role="menu" hidden></div>

  <!-- 파일 메뉴 -->
  <div id="fileMenu" class="menu" role="menu" hidden>
    <button role="menuitem" data-act="library">내 프로젝트 (자동 저장 · 동기화)</button>
    <button role="menuitem" data-act="new">새 프로젝트</button>
    <button role="menuitem" data-act="open">프로젝트 열기 (.byr.json)</button>
    <button role="menuitem" data-act="save">프로젝트 저장</button>
    <hr>
    <button role="menuitem" data-act="legacy">기존 앱 작업물 가져오기 (JSON)</button>
    <button role="menuitem" data-act="account">기존 앱 계정에서 불러오기 (로그인)</button>
    <button role="menuitem" data-act="sample">기존 앱 샘플 불러오기</button>
    <hr>
    <button role="menuitem" data-act="rooms">공간 목록 · 공간만 작업</button>
    <button role="menuitem" data-act="bg">배경 (주변 거리) · 도면 밑그림</button>
    <button role="menuitem" data-act="ai">AI (Claude · ChatGPT · Gemini) · 도면 → 벽 · 사진 → 기물</button>
    <button role="menuitem" data-act="asset">3D 에셋 가져오기 (GLB · GLTF · OBJ · FBX)</button>
    <hr>
    <button role="menuitem" data-act="glb">전체 장면 내보내기 · GLB (Blender · D5 · Twinmotion)</button>
    <button role="menuitem" data-act="glbAll">모든 층 내보내기 · GLB (층 높이대로 쌓아서)</button>
    <button role="menuitem" data-act="obj">전체 장면 내보내기 · OBJ</button>
    <button role="menuitem" data-act="png">화면 이미지 저장 · PNG</button>
    <hr>
    <button role="menuitem" data-act="home">홈 화면</button>
    <button role="menuitem" data-act="quit" id="miQuit">종료</button>
  </div>

  <!-- 왼쪽 접이식 서랍: 기물 목록 (아코디언) -->
  <aside id="drawer" aria-label="기물 목록" aria-hidden="true">
    <div class="dhead"><b>기물</b><button class="ib" id="btnDrawerClose" aria-label="기물 목록 닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <input id="search" type="search" placeholder="기물 찾기 (예: 냉장고, 튀김기)" aria-label="기물 찾기">
    <div id="catalog"></div>
  </aside>
  <div id="scrim" hidden></div>

  <!-- 오른쪽 아래 FAB + 속성 카드 (팝오버) -->
  <button id="fab" class="ib" aria-label="속성 열기" aria-expanded="false" title="속성"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <section id="props" class="card" aria-label="속성" hidden>
    <div class="chead"><b id="propsTitle">장면 설정</b><button class="ib" id="btnPropsClose" aria-label="속성 닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="propsBody"></div>
  </section>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- 걷기 모드 -->
  <div id="walkUI" hidden>
    <div id="walkPad" aria-label="이동 조이스틱"><i></i></div>
    <div class="wbtns"><button class="btn" id="walkUp" aria-label="눈높이 올리기">눈 ▲</button><button class="btn" id="walkDown" aria-label="눈높이 내리기">눈 ▼</button><button class="btn" id="walkThrough" aria-pressed="false">통과</button><button class="btn pri" id="walkExit">걷기 끝</button></div>
  </div>

  <!-- 홈 (대시보드): 이어서 하기 · 내 프로젝트 · 계정 · AI -->
  <section id="home" aria-label="홈" hidden>
    <div class="hin">
      <header class="hhead"><span class="logo sm" aria-hidden="true"></span><div><b>BYR2</b><small id="homeVer"></small></div><div class="grow"></div><button class="ib" id="homeClose" aria-label="홈 닫기" title="작업 화면으로"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div id="homeBody"></div>
      <footer class="credit">Created by Marcus Lee</footer>
    </div>
  </section>

  <!-- 확인 창 (뒤로 가기 · 종료 · 새 프로젝트) -->
  <div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT" hidden><div class="dbox"><b id="dlgT"></b><p id="dlgM"></p><div class="btns" id="dlgB"></div></div></div>
  <div id="drop" hidden><div>여기에 놓으면 가져와요<br><small>기존 앱 JSON · 프로젝트 · GLB / GLTF / OBJ / FBX</small></div></div>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
